name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Build
        run: |
          # A custom domain (public/CNAME) or a USERNAME.github.io repo serves
          # from the root "/". Any other repo serves from /repo-name/.
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -f public/CNAME || "$REPO" == *.github.io ]]; then
            pnpm build
          else
            FIGMA_PUBLIC_URL="/$REPO" pnpm build
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
